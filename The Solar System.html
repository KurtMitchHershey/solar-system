<html lang="en">
<head>

<title>The Solar System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Hanken+Grotesk:wght@300;400;600&display=swap">
<style>
:root{--ink:#02030a;--star:#e9ecf5;--dim:#8a93ad;--line:rgba(180,190,230,.18);--ember:#ffb86b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

#bg{position:fixed;inset:-3%;transition:transform .6s ease-out}
#bg::before{content:"";position:absolute;inset:0;background:var(--mw,none) center/cover no-repeat,radial-gradient(ellipse at 20% 80%,rgba(40,20,90,.35),transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(10,40,90,.3),transparent 50%),#02030a}
.gx{position:absolute;width:120vmax;height:46vmax;left:50%;top:40%;margin:-23vmax 0 0 -60vmax;transform:rotate(-28deg);filter:blur(18px);animation:drift 140s ease-in-out infinite alternate;
background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(150,130,255,.2),rgba(70,50,160,.09) 45%,transparent 70%),radial-gradient(ellipse 20% 36% at 30% 50%,rgba(255,190,140,.1),transparent 70%),radial-gradient(ellipse 16% 28% at 72% 46%,rgba(120,180,255,.1),transparent 70%)}
.gx.b{width:90vmax;height:30vmax;margin:-15vmax 0 0 -45vmax;transform:rotate(-28deg) translateY(2vmax);opacity:.5;animation-duration:200s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:rotate(-24deg) scale(1.06)}}
.st{position:absolute;left:0;top:0;border-radius:50%;animation:tw ease-in-out infinite alternate}
@keyframes tw{from{opacity:.5}to{opacity:1}}
#gl{position:fixed;inset:0;z-index:10;width:100%;height:100%}
#tip{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s;padding:5px 12px;border-radius:99px;background:rgba(5,7,20,.7);border:1px solid var(--line);font-size:.85rem;backdrop-filter:blur(6px)}
#ttl{position:fixed;left:clamp(20px,4vw,56px);top:clamp(20px,5vh,48px);max-width:30ch;z-index:40;transition:opacity .6s}
#ttl h1{margin:0 0 .3em;font:300 clamp(1.9rem,4vw,3.2rem)/1.05 Fraunces,Georgia,serif;letter-spacing:-.01em}

#lg{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:40;padding:6px;border:1px solid var(--line);border-radius:99px;background:rgba(5,7,20,.55);backdrop-filter:blur(8px);transition:opacity .6s;max-width:96vw;overflow-x:auto}
#lg button{display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--dim);font:inherit;font-size:.85rem;padding:6px 11px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
#lg button:hover,#lg button:focus-visible{background:rgba(255,255,255,.08);color:var(--star);outline:none}
#lg i{width:9px;height:9px;border-radius:50%;background:var(--c)}
body.focus #ttl,body.focus #lg{opacity:0;pointer-events:none}
#back{position:fixed;left:clamp(20px,4vw,56px);top:clamp(20px,5vh,48px);z-index:50;opacity:0;pointer-events:none;border:1px solid var(--line);background:rgba(5,7,20,.55);color:var(--star);font:inherit;padding:9px 18px;border-radius:99px;cursor:pointer;backdrop-filter:blur(8px);transition:opacity .6s,background .2s}
#back:hover{background:rgba(255,255,255,.12)}
body.focus #back{opacity:1;pointer-events:auto;transition-delay:.8s}
#slot{position:fixed;left:0;top:0;width:50%;height:100%;pointer-events:none}
#info{position:fixed;right:0;top:0;width:50%;height:100%;padding:13vh 6vw 8vh 1vw;overflow-y:auto;opacity:0;transform:translateX(5vw);pointer-events:none;transition:opacity .6s,transform .8s;z-index:40}
body.focus #info{opacity:1;transform:none;pointer-events:auto;transition:opacity .9s .8s,transform .9s .8s}
.ty{margin:0;color:var(--ember);font-size:.95rem}
#info h2{margin:.1em 0 .25em;font:300 clamp(3rem,7vw,6rem)/1 Fraunces,Georgia,serif;letter-spacing:-.02em}
.ds{max-width:52ch;font-size:1.05rem;color:#c9cfe3}
dl{display:grid;grid-template-columns:repeat(2,1fr);margin:1.6em 0;border-top:1px solid var(--line)}
dl div{padding:.8em 1em .8em 0;border-bottom:1px solid var(--line)}
dl div:nth-child(odd){border-right:1px solid var(--line)}
dl div:nth-child(even){padding-left:1em}
dt{color:var(--dim);font-size:.82rem}
dd{margin:0;font:600 1.15rem/1.3 "Hanken Grotesk",sans-serif}
h3{margin:1.7em 0 .3em;font:300 1.7rem/1.2 Fraunces,Georgia,serif;color:var(--ember)}
.sz{display:flex;align-items:flex-end;gap:12px;margin:1.4em 0 .5em;overflow-x:auto;padding-bottom:4px}
.sz div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;color:var(--dim)}
.sz i{display:block;border-radius:50%;background:#556}
.sz .on{color:var(--star)}
.sz .on i{background:#ffb86b;box-shadow:0 0 14px rgba(255,184,107,.6)}
.cap{color:var(--dim);font-size:.85rem;margin:0 0 1.8em;max-width:52ch}
blockquote+blockquote{margin-top:1.1em}
blockquote{margin:0;padding-left:1.1em;border-left:2px solid var(--ember);max-width:50ch;font:300 1.2rem/1.5 Fraunces,Georgia,serif;color:var(--star)}

@media (prefers-reduced-motion:reduce){.gx,.st,.fl,.core{animation:none}}
</style>
